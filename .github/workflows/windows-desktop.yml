name: Windows desktop inspector executable
on:
  push:
    branches: [main]
    paths:
      - 'multistomp_lab/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test*.py"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Build desktop inspector executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Zezo-MultiStomp-Inspector --collect-submodules multistomp_lab multistomp_lab/desktop.py
          if (-not (Test-Path dist/Zezo-MultiStomp-Inspector.exe)) { throw "EXE not produced" }
      - name: Publish Windows executable (inspection only)
        uses: actions/upload-artifact@v4
        with:
          name: Zezo-MultiStomp-Inspector-Windows
          path: dist/Zezo-MultiStomp-Inspector.exe
          if-no-files-found: error
          retention-days: 14
