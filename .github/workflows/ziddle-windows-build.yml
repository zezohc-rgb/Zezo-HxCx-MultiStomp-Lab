name: Build Ziddle offline renderer (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ziddle-windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download exact source ZIP and verify SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://berbasoft.com/ziddle/ziddle-1794645921.zip' -OutFile ziddle.zip
          $expected = '96d083ab78d6b8c6336a11adcc042044d6f255ba2e81dfa79210a6591e984502'
          $actual = (Get-FileHash ziddle.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP SHA256 mismatch: $actual" }
          Expand-Archive ziddle.zip -DestinationPath source
      - name: Compile actual CLI interpreter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'source/ziddle-1794645921'
          if (-not (Test-Path (Join-Path $root 'Cargo.toml'))) { throw 'Workspace Cargo.toml missing' }
          Push-Location $root
          try {
            cargo build --locked --release -p ziddle-cli --bin ziddle --no-default-features
            if ($LASTEXITCODE -ne 0) { throw "Cargo failed: $LASTEXITCODE" }
            & '.\target\release\ziddle.exe' effect render --help
            if ($LASTEXITCODE -ne 0) { throw "Render help failed: $LASTEXITCODE" }
            Copy-Item '.\target\release\ziddle.exe' (Join-Path $env:GITHUB_WORKSPACE 'ziddle.exe')
          } finally { Pop-Location }
      - name: Upload executable only after successful build
        uses: actions/upload-artifact@v4
        with:
          name: ziddle-windows-renderer
          path: ziddle.exe
          if-no-files-found: error
