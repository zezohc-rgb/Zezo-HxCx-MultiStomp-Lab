name: Ziddle source availability probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ziddle-source-probe.yml'

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          url = "https://berbasoft.com/ziddle/ziddle-1794645921.zip"
          request = urllib.request.Request(url, headers={"User-Agent": "Zezo-MultiStomp-Lab-source-probe/1.0"})
          with urllib.request.urlopen(request, timeout=45) as response:
              data = response.read(150 * 1024 * 1024 + 1)
          if len(data) > 150 * 1024 * 1024:
              raise SystemExit("Source ZIP exceeds 150 MiB limit")
          path = pathlib.Path("ziddle-source.zip")
          path.write_bytes(data)
          print("ZIP size:", len(data), "SHA256:", hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt member: {bad}")
              names = archive.namelist()
              for name in names:
                  parts = pathlib.PurePosixPath(name).parts
                  if name.startswith("/") or ".." in parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
              for component in ("product/cpu/", "product/emu/", "product/formats/"):
                  found = any(component in name for name in names)
                  print(component, "FOUND" if found else "MISSING")
                  if not found:
                      raise SystemExit(f"Missing required source component: {component}")
              cargo = [name for name in names if name.endswith("Cargo.toml")]
              print("Cargo manifests:", len(cargo))
              if not cargo:
                  raise SystemExit("No Cargo manifests")
          PY
      - name: Extract source and check Rust workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ziddle-extracted
          python - <<'PY'
          import pathlib, zipfile
          dest = pathlib.Path("ziddle-extracted").resolve()
          with zipfile.ZipFile("ziddle-source.zip") as archive:
              for member in archive.infolist():
                  path = (dest / member.filename).resolve()
                  if not path.is_relative_to(dest):
                      raise SystemExit("Unsafe archive path")
                  if member.is_dir():
                      path.mkdir(parents=True, exist_ok=True)
                  else:
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(member) as source, path.open("wb") as output:
                          import shutil
                          shutil.copyfileobj(source, output)
          manifests = list(dest.rglob("Cargo.toml"))
          roots = [p for p in manifests if p.parent.name not in ("cpu", "emu", "formats")]
          if not roots:
              raise SystemExit("No candidate Rust workspace root")
          print("Candidate Cargo manifests:", *roots[:10], sep="\\n")
          PY
          ROOT=$(find ziddle-extracted -name Cargo.toml -not -path '*/product/*' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "No top-level Cargo.toml found; cannot verify workspace" >&2
            exit 1
          fi
          cd "$(dirname "$ROOT")"
          cargo metadata --no-deps --format-version 1 > /dev/null
          echo "Cargo workspace metadata validated (not compiled)"
      - name: Report source integrity (no binaries)
        shell: bash
        run: echo "Source ZIP validated; emulation and Windows audio remain untested."
