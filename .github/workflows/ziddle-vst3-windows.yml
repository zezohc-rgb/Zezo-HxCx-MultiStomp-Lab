name: Ziddle VST3 Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ziddle-vst3-windows.yml']
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download verified Ziddle source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://berbasoft.com/ziddle/ziddle-1794645921.zip' -OutFile source.zip
          $hash = (Get-FileHash source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '96d083ab78d6b8c6336a11adcc042044d6f255ba2e81dfa79210a6591e984502') { throw "Source hash mismatch: $hash" }
          Expand-Archive source.zip -DestinationPath source
      - name: Build VST3 engine and CLI
        shell: pwsh
        run: |
          Push-Location source/ziddle-1794645921
          cargo build --locked --release -p ziddle-vst3-headless -p ziddle-cli --no-default-features --features ziddle-cli/plugin,ziddle-cli/documents,ziddle-cli/inspect
          if ($LASTEXITCODE -ne 0) { throw "Rust build failed: $LASTEXITCODE" }
          Copy-Item target/release/ziddle.exe ../../ziddle.exe
          Copy-Item target/release/ziddle_vst3_headless.dll ../../ziddle_vst3_headless.dll
          Pop-Location
      - name: Record plugin builder usage
        shell: pwsh
        run: |
          & ./ziddle.exe plugin build --help | Out-File -Encoding utf8 plugin-build-help.txt
          if ($LASTEXITCODE -ne 0) { throw "Plugin build command failed: $LASTEXITCODE" }
      - name: Upload VST3 build prerequisites
        uses: actions/upload-artifact@v4
        with:
          name: ziddle-vst3-windows-build-tools
          path: |
            ziddle.exe
            ziddle_vst3_headless.dll
            plugin-build-help.txt
          if-no-files-found: error
