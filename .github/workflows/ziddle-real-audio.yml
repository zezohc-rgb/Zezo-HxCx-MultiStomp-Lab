name: Ziddle renderer verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ziddle-real-audio.yml']
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Download and verify upstream Ziddle source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://berbasoft.com/ziddle/ziddle-1794645921.zip' -OutFile ziddle.zip
          $actual = (Get-FileHash ziddle.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '96d083ab78d6b8c6336a11adcc042044d6f255ba2e81dfa79210a6591e984502') { throw "Source hash mismatch: $actual" }
          Expand-Archive ziddle.zip -DestinationPath src
      - name: Build CLI and verify render command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location src/ziddle-1794645921
          cargo build --locked --release -p ziddle-cli --bin ziddle --no-default-features
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          & target/release/ziddle.exe effect render --help | Tee-Object -FilePath ../../render-help.txt
          if ($LASTEXITCODE -ne 0) { throw "Render CLI failed: $LASTEXITCODE" }
          Copy-Item target/release/ziddle.exe ../../ziddle.exe
          Pop-Location
      - name: Run offline-renderer Rust tests
        shell: pwsh
        run: |
          Push-Location src/ziddle-1794645921
          cargo test --locked -p ziddle-offline-renderer --no-default-features -- --nocapture 2>&1 | Tee-Object -FilePath ../../renderer-tests.txt
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "Renderer tests failed: $code" }
      - name: Upload executable and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziddle-renderer-verification
          path: |
            ziddle.exe
            render-help.txt
            renderer-tests.txt
          if-no-files-found: warn
